name: Docker Image Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      with:
        platforms: all

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}
         
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        install: true
      
    - name: Build and Push Multi-Arch Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: xxradar/app:test
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: VERBOSE=true

    # Verify that the Docker image was built successfully
    - name: Verify Docker Image Build
      run: docker images | grep xxradar/app

    - name: Save Docker image as tar
      run: |
        mkdir -p image-artifact
        docker save xxradar/app:test > image-artifact/app-image.tar

    - name: Upload Docker image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image-artifact/app-image.tar
        retention-days: 7
